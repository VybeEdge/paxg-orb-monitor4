name: PAXGUSD ORB live monitor

on:
  schedule:
    # Every 5 minutes, offset 2 minutes past the mark (:02, :07, :12, ...)
    # instead of exactly on it (:00, :05, :10, ...). GitHub's own docs warn
    # that scheduled runs can be delayed "during periods of high load,"
    # and load is worst right at the top of the hour and on the round
    # 5-minute marks every repo's cron defaults to - shifting off that exact
    # alignment is a known, cheap way to reduce how often a run gets queued
    # behind everyone else's. This does NOT fix a brand-new workflow's
    # "cold start" (GitHub can take a while to start firing a schedule that
    # was JUST pushed) - if runs aren't showing up every 5 minutes within
    # the first hour or so, make any trivial edit to this file and push it
    # again; that re-registers the schedule and it starts firing normally.
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the job can commit the updated logs back

concurrency:
  group: paxg-orb-monitor
  cancel-in-progress: false   # never cancel a run mid-write, just queue

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # safety net: a run normally takes ~15-20s: if one
                          # ever hangs, this kills it well before the next
                          # scheduled trigger would otherwise queue up behind it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run monitor
        run: python delta_orb_action.py

      - name: Commit updated logs
        run: |
          git config user.name "orb-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in state.json live_log.txt alerts_log.csv trades_log.csv price_and_equity.csv SUMMARY.md; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Log update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
